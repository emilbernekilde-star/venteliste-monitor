name: Venteliste-monitor

on:
  schedule:
    # Én gang i timen. Hver koersel bliver derefter i live i ~59 minutter og
    # tjekker selv hvert 90. sekund, saa daekningen er sammenhaengende.
    # Vi er altsaa kun afhaengige af GitHubs (upaalidelige) cron én gang i
    # timen i stedet for 12 gange. Starter naeste koersel foer den forrige er
    # slut, saetter concurrency-gruppen den i koe i stedet for at koere dobbelt.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      varighed_minutter:
        description: "Hvor mange minutter kørslen skal blive i live (0 = tjek én gang og stop)"
        required: false
        default: "58"

# To koerslen maa aldrig overlappe - ellers opstaar commit-konflikter paa
# state.json. cancel-in-progress er bevidst false: en igangvaerende koersel
# kan vaere midt i at sende en notifikation om en aaben venteliste.
concurrency:
  group: venteliste-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Skal vaere hoejere end varigheden, ellers draeber GitHub koerslen midtvejs.
    timeout-minutes: 70

    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Opsæt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installér afhængigheder
        run: pip install -r requirements.txt

      - name: Sæt git-identitet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Kør monitor
        env:
          # Scriptet committer selv undervejs, saa en aendring gemmes i samme
          # oejeblik den opdages - ikke foerst naar koerslen slutter om 50 min.
          AUTO_COMMIT: "1"
          POLL_INTERVAL_SEK: "90"
          # Tom ved cron-koersler -> falder tilbage til 59 minutter.
          POLL_VARIGHED_MIN: ${{ inputs.varighed_minutter || '59' }}
        run: python monitor.py
