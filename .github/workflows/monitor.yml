name: Venteliste-monitor

on:
  # Cron er slaaet FRA med vilje. Monitoren koerer nu paa en egen server
  # (Oracle Cloud), hvor en systemd-tjeneste holder processen i live doegnet
  # rundt. GitHubs planlaegger leverede kun 26% daekning maalt over 18 timer -
  # 5 af ~18 koersler blev startet, 6-33 minutter for sent.
  #
  # Manuel koersel er bevaret som reserve: kan Oracle-maskinen ikke koere,
  # kan du starte en 59-minutters koersel her med et enkelt klik.
  # Skal cron slaas til igen, fjernes kommentaren nedenfor.
  #   schedule:
  #     - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      varighed_minutter:
        description: "Hvor mange minutter kørslen skal blive i live (0 = tjek én gang og stop)"
        required: false
        default: "58"

# To koerslen maa aldrig overlappe - ellers opstaar commit-konflikter paa
# state.json. cancel-in-progress er bevidst false: en igangvaerende koersel
# kan vaere midt i at sende en notifikation om en aaben venteliste.
concurrency:
  group: venteliste-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Skal vaere hoejere end varigheden, ellers draeber GitHub koerslen midtvejs.
    timeout-minutes: 70

    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Opsæt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installér afhængigheder
        run: pip install -r requirements.txt

      - name: Sæt git-identitet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Kør monitor
        env:
          # Scriptet committer selv undervejs, saa en aendring gemmes i samme
          # oejeblik den opdages - ikke foerst naar koerslen slutter om 50 min.
          AUTO_COMMIT: "1"
          POLL_INTERVAL_SEK: "90"
          # Tom ved cron-koersler -> falder tilbage til 59 minutter.
          POLL_VARIGHED_MIN: ${{ inputs.varighed_minutter || '59' }}
        run: python monitor.py
